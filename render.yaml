services:
  - type: web
    name: instagram-monitor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.cli run
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Paste the URI from Supabase Dashboard -> Connect -> Connection string -> URI.
      # Use the pooler URI for Render and keep sslmode=require in the value.
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
